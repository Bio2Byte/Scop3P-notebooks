name: Docker Publish

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

env:
  IMAGE_NAME: scop3p-toolkit
  # The apps are one thin layer each on a shared base, so there are two builds:
  # the base, then the app image FROM it. There is no --target any more, and so no
  # way for stage ordering to decide which app gets published.
  BASE_DOCKERFILE: docker/Dockerfile.base
  BASE_IMAGE: scop3p-base:ci
  APP_DOCKERFILE: scop3p-toolkit.Dockerfile
  APP_CONTEXT: docker/apps
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Pytest suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends hmmer t-coffee

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-biophysics.txt
          python -m pip install -r requirements-shiny.txt
          python -m pip install pytest

      - name: Run tests
        run: pytest tests/unit tests/integration

  docker:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare image variables
        id: vars
        shell: bash
        run: |
          namespace="${{ vars.DOCKERHUB_NAMESPACE }}"
          if [[ -z "${namespace}" ]]; then
            namespace="${{ secrets.DOCKERHUB_USERNAME }}"
          fi
          if [[ -z "${namespace}" ]]; then
            namespace="${GITHUB_REPOSITORY_OWNER,,}"
          fi
          version="${GITHUB_SHA}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          fi
          {
            echo "image_repository=${namespace}/${IMAGE_NAME}"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "version=${version}"
          } >> "${GITHUB_OUTPUT}"

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && github.ref_type == 'tag'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: docker.io/${{ steps.vars.outputs.image_repository }}
          flavor: |
            latest=false
          tags: |
            type=sha,format=short,prefix=sha-
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
          labels: |
            org.opencontainers.image.title=Scop3P-Toolkit
            org.opencontainers.image.description=Scop3P toolkit container for Galaxy interactive tool deployment
            org.opencontainers.image.licenses=Apache-2.0

      # Built first and loaded into the local daemon so the app build below can
      # FROM it. Never pushed: publishing scope is the toolkit image only.
      - name: Build base image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ env.BASE_DOCKERFILE }}
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.BASE_IMAGE }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base
          build-args: |
            BUILD_DATE=${{ steps.vars.outputs.build_date }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.vars.outputs.version }}

      # The app image is FROM the base that the previous step loaded into the local
      # daemon, so it is built with plain `docker build` rather than buildx: the
      # default buildx driver runs in its own container and cannot resolve a
      # locally-loaded image in a FROM. No cache is configured because this layer is
      # only an ENV and a CMD -- it builds in about a second.
      - name: Build app image
        if: github.ref_type != 'tag'
        run: |
          docker build \
            --platform linux/amd64 \
            --file "${APP_CONTEXT}/${APP_DOCKERFILE}" \
            --build-arg "BASE_IMAGE=${BASE_IMAGE}" \
            --tag "${IMAGE_NAME}:ci" \
            "${APP_CONTEXT}"
          docker image inspect "${IMAGE_NAME}:ci" \
            --format 'built {{index .Config.Labels "org.opencontainers.image.title"}} / app={{range .Config.Env}}{{if eq (index (split . "=") 0) "SCOP3P_APP_NAME"}}{{index (split . "=") 1}}{{end}}{{end}}'

      - name: Build and push app image
        if: github.ref_type == 'tag'
        run: |
          tag_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && tag_args+=(--tag "$tag")
          done <<< "${{ steps.meta.outputs.tags }}"

          label_args=()
          while IFS= read -r label; do
            [ -n "$label" ] && label_args+=(--label "$label")
          done <<< "${{ steps.meta.outputs.labels }}"

          docker build \
            --platform linux/amd64 \
            --file "${APP_CONTEXT}/${APP_DOCKERFILE}" \
            --build-arg "BASE_IMAGE=${BASE_IMAGE}" \
            "${tag_args[@]}" "${label_args[@]}" \
            "${APP_CONTEXT}"

          while IFS= read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"
