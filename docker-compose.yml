services:
  scop3p-toolkit:
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: scop3p-toolkit
    image: bio2byte/scop3p-toolkit:0.1.0
    ports:
      - "8000:8000"

  peptide-mapper:
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: peptide-mapper
    image: bio2byte/peptide-mapper:0.1.0
    ports:
      - "8001:8000"

  structure-viz:
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: structure-viz
    image: bio2byte/structure-viz:0.1.0
    ports:
      - "8002:8000"

  mutation-effect:
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: mutation-effect
    image: bio2byte/mutation-effect:0.1.0
    ports:
      - "8003:8000"
