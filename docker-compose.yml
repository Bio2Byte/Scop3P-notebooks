services:
  scop3p-suite:
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: scop3p-suite
    image: scop3p/scop3p-suite:dev
    ports:
      - "8000:8000"

  peptide-mapper:
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: peptide-mapper
    image: scop3p/peptide-mapper:dev
    ports:
      - "8001:8000"

  structure-viz:
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: structure-viz
    image: scop3p/structure-viz:dev
    ports:
      - "8002:8000"

  mutation-effect:
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: mutation-effect
    image: scop3p/mutation-effect:dev
    ports:
      - "8003:8000"
